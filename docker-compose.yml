version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: neo4j_knowledge_graph
    ports:
      - "7474:7474"   # Панель управления Neo4j (Браузер)
      - "7687:7687"   # Порт подключения Python-драйвера
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant_vector_store
    ports:
      - "6333:6333"   # API порт Qdrant
      - "6334:6334"   # gRPC порт
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_storage: